<div class="wrap" *ngIf="!loading; else loadingTpl">
  <img *ngIf="payment.logo" [src]="payment.logo" class="logo" alt="merchant-logo" />
  <h2>{{ t.title }}</h2>
  <p>{{ payment.description }}</p>
  <app-payment-details [usdAmount]="payment.amountUSD" [quote]="cryptoQuote"></app-payment-details>
  <app-crypto-selector [assets]="acceptedAssets" (selected)="onAssetSelected($event)"></app-crypto-selector>
  <app-countdown-timer [expiresAt]="payment.expiresAt"></app-countdown-timer>
  <app-status-screen [status]="status" [t]="t"></app-status-screen>
</div>
<ng-template #loadingTpl><div class="loading">Loading...</div></ng-template>
